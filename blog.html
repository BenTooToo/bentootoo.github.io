    <header class="site-header">
      <div class="more-menu">
        <button class="more-toggle" type="button" aria-expanded="false" aria-controls="moreDropdown" aria-label="More" data-i18n-aria="more.menuLabel">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="more-dropdown" id="moreDropdown">
          <div class="donate-menu">
            <button class="donate-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="donateSubmenu" data-i18n="more.donate">捐助我</button>
            <div class="donate-submenu" id="donateSubmenu" role="menu" aria-label="Support links">
              <a href="https://onlyfans.com/bentootoo" target="_blank" rel="me noreferrer" role="menuitem">

              </a>
            </div>
          </div>
          <a href="#devlog" data-i18n="more.devlog">开发日志</a>
        </div>
      </div>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html#top" data-i18n="nav.home">首页</a>
        <a href="index.html#projects" data-i18n="nav.projects">项目</a>

        <a href="index.html#contact" data-i18n="nav.contact">联系我</a>
      </nav>

      <div class="language-switch" aria-label="Language selector">
        <button class="lang-button is-active" type="button" data-lang="zh">中</button>
        <button class="lang-button" type="button" data-lang="en">EN</button>
        <button class="lang-button" type="button" data-lang="fr">FR</button>
      </div>
    </header>

    <main id="top" class="blog-map-main">
      <section class="blog-map-section section-panel">
        <canvas id="blogStarCanvas" aria-hidden="true"></canvas>

        <div class="blog-map-board" id="blogMap" data-reveal aria-label="思索之屋文章思维导图">
          <svg class="map-lines" aria-hidden="true"></svg>

          <div class="map-node-layer" id="blogMapNodes"></div>
        </div>
      </section>
    </main>

    <div class="article-reader" id="articleReader" aria-hidden="true"></div>

    <aside class="thought-dock" id="thoughtDock" aria-label="和本2兔探讨你的想法">
      <button class="thought-invitation" id="thoughtInvitation" type="button" aria-expanded="false" aria-controls="thoughtPanel">
        <span data-thought-text="invitation">和本2兔探讨你的想法</span>
      </button>

      <section class="thought-panel" id="thoughtPanel" aria-hidden="true" inert>
        <div class="thought-panel-head">
          <button class="thought-close" id="thoughtClose" type="button" aria-label="关闭">×</button>
        </div>

        <form class="thought-form" id="thoughtForm">
          <label class="thought-field thought-field-message">
            <span data-thought-text="messageLabel">你的想法</span>
            <textarea name="message" rows="6" required maxlength="4000" placeholder="写下此刻让你停留的念头……" data-thought-placeholder="messagePlaceholder"></textarea>
          </label>

          <fieldset class="thought-articles">
            <legend data-thought-text="articlesLegend">哪些文章引发了你的思考？</legend>
            <div class="thought-article-list" id="thoughtArticleList"></div>
          </fieldset>

          <fieldset class="thought-identity">
            <legend data-thought-text="identityLegend">如何称呼你？</legend>
            <div class="thought-identity-options">
              <label>
                <input type="radio" name="identity_mode" value="nickname" checked>
                <span data-thought-text="nicknameChoice">留下昵称</span>
              </label>
              <label>
                <input type="radio" name="identity_mode" value="anonymous">
                <span data-thought-text="anonymousChoice">匿名</span>
              </label>
            </div>
            <label class="thought-nickname" id="thoughtNicknameField">
              <span class="sr-only" data-thought-text="nicknameLabel">昵称</span>
              <input type="text" name="nickname" maxlength="60" placeholder="你的昵称" data-thought-placeholder="nicknamePlaceholder">
            </label>
          </fieldset>

          <input class="thought-honeypot" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <p class="thought-status" id="thoughtStatus" role="status" aria-live="polite"></p>
          <button class="thought-submit" type="submit" data-thought-text="submit">发送</button>
        </form>
      </section>
    </aside>

    <div class="thought-backdrop" id="thoughtBackdrop" aria-hidden="true"></div>

    <a class="back-to-top" href="#top" aria-label="Back to top" data-i18n-aria="contact.backTop">↑</a>

    <footer class="site-footer">
      <span>© <span id="year">2026</span> <span data-i18n="name.display">本2兔</span></span>
      <span data-i18n="footer.note">Built for GitHub Pages.</span>
    </footer>

    <script src="app.js?v=cosmos6" defer></script>
    <script src="devlog.js?v=devlog2" defer></script>
    <script src="blog-map.js?v=blog-map19" defer></script>
    <script src="feedback.js?v=thought-house1" defer></script>
  </body>
</html>
