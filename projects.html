  <body class="project-library-body">
    <div class="page-progress" aria-hidden="true"></div>

    <header class="site-header">
      <div class="more-menu">
        <button class="more-toggle" type="button" aria-expanded="false" aria-controls="moreDropdown" aria-label="更多" data-i18n-aria="more.menuLabel">
          <span></span><span></span><span></span>
        </button>
        <div class="more-dropdown" id="moreDropdown">
          <div class="donate-menu">
            <button class="donate-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="donateSubmenu" data-i18n="more.donate">捐助我</button>
            <div class="donate-submenu" id="donateSubmenu" role="menu" aria-label="Support links">
              <a href="https://onlyfans.com/bentootoo" target="_blank" rel="me noreferrer" role="menuitem"><span>OnlyFans</span><small data-i18n="donate.onlyfansRegion">（全球）</small></a>
              <a href="https://afdian.com/a/bentootoo" target="_blank" rel="me noreferrer" role="menuitem"><span>爱发电</span><small data-i18n="donate.afdianRegion">（中国）</small></a>
            </div>
          </div>
          <a href="#devlog" data-i18n="more.devlog">开发日志</a>
        </div>
      </div>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html#top" data-i18n="nav.home">首页</a>
        <a href="projects.html" aria-current="page" data-i18n="nav.projects">项目</a>
        <a href="blog.html" data-i18n="nav.blog">思索之屋</a>
        <a href="index.html#contact" data-i18n="nav.contact">联系我</a>
      </nav>

      <div class="language-switch" aria-label="Language selector">
        <button class="lang-button is-active" type="button" data-lang="zh">中</button>
        <button class="lang-button" type="button" data-lang="en">EN</button>
        <button class="lang-button" type="button" data-lang="fr">FR</button>
      </div>
    </header>

    <main id="top" class="project-library-main">
      <section class="project-library-section" aria-label="项目保存库" data-project-aria="libraryLabel">
        <div class="project-library-shell">
          <div class="archive-toolbar">
            <p class="archive-count" id="archiveCount" aria-live="polite"></p>
            <div class="archive-filters" role="group" aria-label="项目分类" data-project-aria="filtersLabel">
              <button class="archive-filter" type="button" data-filter="favorite" data-project-text="filterFavorites">我的最爱</button>
              <button class="archive-filter is-active" type="button" data-filter="all" data-project-text="filterAll">全部</button>
              <button class="archive-filter" type="button" data-filter="tool" data-project-text="filterTools">工具</button>
              <div class="archive-filter-menu">
                <button class="archive-filter" type="button" data-filter="game" aria-expanded="false" aria-controls="gameFilters" data-project-text="filterGames">游戏</button>
                <div class="archive-game-filters" id="gameFilters" hidden>
                  <div class="game-genre-options" role="group" aria-label="筛选游戏类型" data-project-aria="gameGenresLabel">
                    <button class="game-genre-filter is-active" type="button" data-filter-group="genre" data-filter-value="action" aria-pressed="true" data-project-text="genreAction">动作</button>
                    <button class="game-genre-filter is-active" type="button" data-filter-group="genre" data-filter-value="puzzle" aria-pressed="true" data-project-text="genrePuzzle">解密</button>
                    <button class="game-genre-filter is-active" type="button" data-filter-group="genre" data-filter-value="text" aria-pressed="true" data-project-text="genreText">文字</button>
                    <button class="game-genre-filter is-active" type="button" data-filter-group="genre" data-filter-value="adventure" aria-pressed="true" data-project-text="genreAdventure">冒险</button>
                    <button class="game-genre-filter is-active" type="button" data-filter-group="genre" data-filter-value="horror" aria-pressed="true" data-project-text="genreHorror">恐怖</button>
                    <button class="game-genre-filter is-active" type="button" data-filter-group="genre" data-filter-value="idle" aria-pressed="true" data-project-text="genreIdle">放置</button>
                    <button class="game-genre-filter is-active" type="button" data-filter-group="genre" data-filter-value="story" aria-pressed="true" data-project-text="genreStory">剧情</button>
                  </div>
                  <div class="game-filter-actions">
                    <button type="button" data-select-all="genre" data-project-text="selectAll">全选</button>
                    <button type="button" data-clear-all="genre" data-project-text="clearAll">清除</button>
                  </div>
                  <h3 class="game-filter-heading" data-project-text="artStylesLabel">美术风格</h3>
                  <div class="game-genre-options" role="group" data-project-aria="artStylesLabel" aria-label="美术风格">
                    <button class="game-genre-filter is-active" type="button" data-filter-group="artStyle" data-filter-value="2d" aria-pressed="true" data-project-text="art2d">2D</button>
                    <button class="game-genre-filter is-active" type="button" data-filter-group="artStyle" data-filter-value="pixel" aria-pressed="true" data-project-text="artPixel">像素</button>
                    <button class="game-genre-filter is-active" type="button" data-filter-group="artStyle" data-filter-value="3d" aria-pressed="true" data-project-text="art3d">3D</button>
                  </div>
                  <div class="game-filter-actions">
                    <button type="button" data-select-all="artStyle" data-project-text="selectAll">全选</button>
                    <button type="button" data-clear-all="artStyle" data-project-text="clearAll">清除</button>
                  </div>
                  <h3 class="game-filter-heading" data-project-text="progressLabel">进度</h3>
                  <div class="game-genre-options" role="group" data-project-aria="progressLabel" aria-label="进度">
                    <button class="game-genre-filter is-active" type="button" data-filter-group="progress" data-filter-value="release" aria-pressed="true" data-project-text="progressRelease">正式版</button>
                    <button class="game-genre-filter is-active" type="button" data-filter-group="progress" data-filter-value="beta" aria-pressed="true" data-project-text="progressBeta">测试版</button>
                    <button class="game-genre-filter is-active" type="button" data-filter-group="progress" data-filter-value="development" aria-pressed="true" data-project-text="progressDevelopment">正在开发</button>
                  </div>
                  <div class="game-filter-actions">
                    <button type="button" data-select-all="progress" data-project-text="selectAll">全选</button>
                    <button type="button" data-clear-all="progress" data-project-text="clearAll">清除</button>
                  </div>
                </div>
              </div>
              <button class="archive-filter" type="button" data-filter="other" data-project-text="filterOther">其他</button>
              <button class="archive-filter" type="button" data-filter="work" data-project-text="filterWork">工作项目</button>
            </div>
          </div>

          <div class="archive-grid" id="archiveGrid"></div>
          <p class="archive-empty" id="archiveEmpty" hidden data-project-text="empty">这个分类里暂时还没有项目。</p>
        </div>
      </section>
    </main>

    <a class="back-to-top" href="#top" aria-label="回到顶部" data-i18n-aria="contact.backTop">↑</a>

      <span data-i18n="footer.note">Built for GitHub Pages.</span>

    <script src="projects.js?v=archive17" defer></script>
